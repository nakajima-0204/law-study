name: 法令自動更新

on:
  schedule:
    - cron: "0 15 * * *" # 毎日 深夜0時JST（UTC 15時）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 依存関係インストール
        run: npm ci

      - name: 新法律を取得・分類（週1回・月曜のみ）
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * 1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-laws.mjs

      - name: 全条文をプリフェッチ（週1回・月曜のみ）
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15 * * 1'
        run: node scripts/prefetch-articles.mjs

      - name: 重要判例をプリジェネレート（毎日30件ずつ）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/prefetch-cases.mjs --limit=30

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "auto: 判例データ更新 $(date +'%Y-%m-%d')"
            git push
          fi
