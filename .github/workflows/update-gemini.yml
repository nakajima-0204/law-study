name: Gemini モデル自動更新

on:
  schedule:
    # 毎月1日 18:30 UTC = 毎月1日 3:30 JST
    - cron: "30 18 1 * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 最新 Gemini モデルを確認・更新
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-gemini-model.mjs

      - name: 変更があればコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/model.ts
          if git diff --staged --quiet; then
            echo "モデルの変更なし"
          else
            git commit -m "auto: Gemini モデルを最新版に更新 $(date +'%Y-%m-%d')"
            git push
          fi
